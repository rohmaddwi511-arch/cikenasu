<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok 700-Agents Swarm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#030406;color:#f3f4f6;-webkit-tap-highlight-color:transparent}
.gc{background:rgba(12,16,23,.95);border:1px solid rgba(255,255,255,.08)}
.inp{width:100%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:.6rem;padding:.45rem .6rem;font-size:12px;color:#fff;outline:none}
.inp:focus{border-color:#22c55e}
.lbl{font-size:10px;color:#a1a1aa;font-weight:600;display:block;margin-bottom:2px}
@keyframes up{0%{transform:translateY(30px);opacity:0}12%,85%{transform:none;opacity:1}100%{transform:translateY(-20px);opacity:0}}
.toast{animation:up 4s forwards}
.bub{animation:pop .3s ease-out}@keyframes pop{from{transform:translateY(-10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body class="min-h-screen pb-24">
<div id="toasts" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-md mx-auto"></div>
<div id="bubbles" class="fixed top-16 left-3 right-3 z-50 flex flex-col gap-2 pointer-events-none max-w-md mx-auto"></div>

<header class="px-4 py-3 sticky top-0 z-40 bg-[#030406]/95 backdrop-blur border-b border-white/5 flex items-center justify-between">
  <div class="flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center"><i class="fa-solid fa-network-wired text-green-400"></i></div>
    <div>
      <h1 class="font-bold text-sm">Grok 700-Agents Swarm <i id="dot" class="fa-solid fa-circle text-[6px] text-zinc-600"></i></h1>
      <p id="solPrice" class="text-[10px] text-zinc-400">SOL: -</p>
    </div>
  </div>
  <button id="btnCfg" class="bg-gradient-to-r from-green-500 to-emerald-600 text-black font-extrabold px-3.5 py-2 rounded-xl text-xs">Set Key</button>
</header>

<main class="max-w-xl mx-auto p-4 space-y-4">

  <section id="cfgCard" class="gc rounded-2xl p-4 space-y-3 border-green-500/30">
    <div class="text-xs font-bold">Wallet burner &amp; pengaturan</div>
    <div>
      <label class="lbl">Private key (Base58 atau array JSON) — tetap aktif saat refresh selama tab belum ditutup</label>
      <input id="pk" type="password" autocomplete="off" placeholder="Private key wallet burner" class="inp font-mono">
    </div>
    <div>
      <label class="lbl">PIN (opsional, min. 4 karakter): simpan key terenkripsi di perangkat ini agar bisa dibuka lagi walau tab ditutup</label>
      <input id="pin" type="password" autocomplete="off" placeholder="PIN" class="inp">
    </div>
    <div class="grid grid-cols-3 gap-2">
      <div><label class="lbl">Beli per trade (SOL)</label><input id="c_buy" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Take profit (%)</label><input id="c_tp" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Stop loss (%)</label><input id="c_sl" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Maks posisi</label><input id="c_max" class="inp" inputmode="numeric"></div>
      <div><label class="lbl">Min likuiditas ($)</label><input id="c_liq" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Min volume 1j ($)</label><input id="c_vol" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Umur maks (jam)</label><input id="c_age" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Slippage (%)</label><input id="c_slip" class="inp" inputmode="decimal"></div>
      <div><label class="lbl">Priority fee (SOL)</label><input id="c_fee" class="inp" inputmode="decimal"></div>
    </div>
    <div><label class="lbl">RPC URL (biarkan /api/rpc untuk proxy Vercel milikmu)</label><input id="c_rpc" class="inp font-mono"></div>
    <div><label class="lbl">Jupiter API key (opsional, dari portal.jup.ag)</label><input id="c_jup" class="inp font-mono"></div>
    <div class="flex items-center justify-between">
      <button id="btnClear" class="text-[11px] text-red-400 font-bold">Hapus key</button>
      <button id="btnSave" class="bg-green-500 text-black px-4 py-2 rounded-xl font-extrabold text-xs">Simpan &amp; aktifkan wallet</button>
    </div>
    <p id="pkErr" class="text-[11px] text-red-400 font-bold"></p>
  </section>

  <section class="gc rounded-2xl p-5 space-y-4">
    <div class="flex justify-between items-start">
      <div>
        <span class="text-[10px] text-zinc-400 font-semibold">SALDO WALLET</span>
        <div id="bal" class="text-3xl font-black">0.0000 SOL</div>
        <div id="balIdr" class="text-xs font-bold text-green-400">Rp 0</div>
        <div id="addr" class="text-[10px] text-zinc-400 font-mono mt-1">Private key belum diisi</div>
      </div>
      <div id="badge" class="bg-zinc-800 text-zinc-400 px-3 py-1.5 rounded-xl text-xs font-extrabold">STANDBY</div>
    </div>
    <div class="grid grid-cols-2 gap-2.5">
      <button id="btnRun" class="py-3 rounded-xl bg-green-500 text-black font-extrabold text-xs"><i class="fa-solid fa-play text-[10px]"></i> START AUTO-BUY</button>
      <button id="btnStop" class="py-3 rounded-xl bg-zinc-900 border border-white/10 text-zinc-300 font-extrabold text-xs"><i class="fa-solid fa-stop text-[10px]"></i> STOP</button>
    </div>
    <p class="text-[10px] text-zinc-500">TP/SL jalan otomatis selama tab ini terbuka dan wallet aktif, walau auto-buy dihentikan.</p>
  </section>

  <div id="tabMarket" class="space-y-3">
    <div class="gc rounded-2xl p-2 flex gap-2">
      <input id="q" class="inp" placeholder="Paste contract address (CA) atau nama token">
      <button id="btnQ" class="bg-zinc-800 text-green-400 px-3 rounded-lg text-xs font-bold">Cari</button>
    </div>
    <div class="flex gap-2 items-center">
      <button data-cat="new" class="cat px-3.5 py-2 rounded-xl text-xs font-bold">Baru</button>
      <button data-cat="hot" class="cat px-3.5 py-2 rounded-xl text-xs font-bold">Trending</button>
      <button id="btnRef" class="ml-auto bg-zinc-900 text-green-400 px-3 py-2 rounded-xl border border-white/10 text-xs font-bold"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    </div>
    <div id="feedMsg" class="text-[10px] text-zinc-500"></div>
    <div id="feed" class="space-y-3"></div>
  </div>

  <div id="tabPort" class="space-y-4 hidden">
    <div class="gc rounded-2xl p-5">
      <div class="text-xs text-zinc-400 font-bold">Total (saldo + posisi, perkiraan)</div>
      <div id="pTot" class="text-2xl font-black">0.0000 SOL</div>
      <div id="pPnl" class="text-xs font-extrabold text-zinc-400 mt-1">PnL posisi: 0.0000 SOL</div>
    </div>
    <div id="posList" class="space-y-2.5"></div>
    <div class="gc rounded-2xl p-4"><div class="text-[10px] font-bold text-zinc-400 mb-1">RIWAYAT TRADE</div><div id="histList"></div></div>
    <div class="gc rounded-2xl p-4 space-y-2">
      <div class="flex justify-between"><span class="text-[10px] font-bold text-zinc-400">LOG</span><button id="btnLogClr" class="text-[10px] text-zinc-500">Clear</button></div>
      <div id="log" class="bg-black/70 rounded-xl p-3 h-52 overflow-y-auto font-mono text-[10px] space-y-1 break-words"></div>
    </div>
  </div>
</main>

<nav class="fixed bottom-0 inset-x-0 bg-[#030406]/95 backdrop-blur border-t border-white/5 py-3 px-6 flex justify-around text-xs z-40">
  <button id="nM" class="flex flex-col items-center gap-1"><i class="fa-solid fa-fire text-base"></i>Market</button>
  <button id="nP" class="flex flex-col items-center gap-1"><i class="fa-solid fa-wallet text-base"></i>Portofolio</button>
</nav>

<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SOLM='So11111111111111111111111111111111111111112',DS='https://api.dexscreener.com',IDR=16200;
const DEF={rpc:'/api/rpc',jup:'',buy:0.01,tp:10,sl:5,max:3,liq:10000,vol:5000,age:24,slip:15,fee:0.0003};
const FIELDS=Object.keys(DEF);
const S={kp:null,pub:'',sol:0,solUsd:0,tokens:[],by:{},cat:'new',run:false,scanning:false,mon:false,
  cfg:{...DEF,...JSON.parse(localStorage.getItem('g_cfg')||'{}')},pos:JSON.parse(localStorage.getItem('g_pos')||'{}')};
if(S.cfg.rpc==='https://api.mainnet-beta.solana.com')S.cfg.rpc='/api/rpc';
const tried=new Set();
S.hist=JSON.parse(localStorage.getItem('g_hist')||'[]');
const savePos=()=>localStorage.setItem('g_pos',JSON.stringify(S.pos));

/* ---------- util ---------- */
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function decodeBase58(s){const b=[0];for(const ch of s){const v=B58.indexOf(ch);if(v<0)throw new Error('Karakter Base58 tidak valid');let c=v;for(let j=0;j<b.length;j++){c+=b[j]*58;b[j]=c&255;c>>=8}while(c>0){b.push(c&255);c>>=8}}for(let i=0;i<s.length&&s[i]==='1';i++)b.push(0);return new Uint8Array(b.reverse())}
const b64enc=u=>btoa(String.fromCharCode(...u));
const b64dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const fmtP=p=>Number(p).toLocaleString('en-US',{maximumSignificantDigits:4,maximumFractionDigits:12});
const fmtN=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n||0)+'';
const fmtAge=ms=>{if(!ms)return '-';const m=(Date.now()-ms)/6e4;return m<60?Math.round(m)+'m':m<1440?(m/60).toFixed(1)+'j':Math.round(m/1440)+'h'};
async function jget(url,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(url,{...opt,signal:c.signal});const tx=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+': '+tx.slice(0,120));return JSON.parse(tx)}finally{clearTimeout(t)}}
async function rpc(method,params){const r=await jget(S.cfg.rpc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});if(r.error)throw new Error(r.error.message);return r.result}
function toast(t,s){const d=document.createElement('div');d.className='toast gc rounded-2xl p-3 text-xs border-green-500/40';d.innerHTML=`<div class="font-bold">${esc(t)}</div><div class="text-[10px] text-green-400">${esc(String(s).slice(0,140))}</div>`;$('toasts').appendChild(d);setTimeout(()=>d.remove(),4000)}
function log(m,t='info'){const c={info:'text-zinc-300',ok:'text-green-400 font-bold',err:'text-red-400 font-bold',warn:'text-amber-400'}[t];const d=document.createElement('div');d.className=c;d.textContent=new Date().toLocaleTimeString('id-ID',{hour12:false})+' '+m;const b=$('log');b.appendChild(d);b.scrollTop=b.scrollHeight;if(t==='err')toast('Error',m)}
let chain=Promise.resolve();
const run=fn=>{const p=chain.then(fn);chain=p.catch(()=>{});return p};

/* ---------- settings & wallet ---------- */
function cfgToUI(){FIELDS.forEach(k=>$('c_'+k).value=S.cfg[k])}
function readCfg(){FIELDS.forEach(k=>{const v=$('c_'+k).value.trim();S.cfg[k]=(k==='rpc'||k==='jup')?v:(parseFloat(v)||DEF[k])});if(!S.cfg.rpc)S.cfg.rpc=DEF.rpc;localStorage.setItem('g_cfg',JSON.stringify(S.cfg))}
const enc=new TextEncoder(),dec=new TextDecoder();
async function pinKey(pin,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encKey(raw,pin){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await pinKey(pin,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(raw)));localStorage.setItem('g_enc',JSON.stringify({s:b64enc(salt),i:b64enc(iv),c:b64enc(ct)}))}
async function decKey(pin){const o=JSON.parse(localStorage.getItem('g_enc'));const k=await pinKey(pin,b64dec(o.s));return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64dec(o.i)},k,b64dec(o.c)))}
async function saveKey(){
  try{
    readCfg();
    const typed=$('pk').value.trim().replace(/\s+/g,''),pin=$('pin').value;
    let raw=typed;
    if(!raw&&!S.kp&&localStorage.getItem('g_enc')&&pin){try{raw=await decKey(pin)}catch(e){throw new Error('PIN salah')}}
    if(!raw&&!S.kp){$('pkErr').textContent='Pengaturan disimpan. Isi private key (atau PIN jika key sudah tersimpan) untuk mengaktifkan wallet.';return}
    if(raw){
      if(typed&&pin&&pin.length<4)throw new Error('PIN minimal 4 karakter');
      const sk=raw.startsWith('[')?Uint8Array.from(JSON.parse(raw)):decodeBase58(raw);
      if(sk.length!==64)throw new Error('Panjang key harus 64 byte (Base58 export dari Phantom/Solflare)');
      S.kp=solanaWeb3.Keypair.fromSecretKey(sk);S.pub=S.kp.publicKey.toBase58();
      sessionStorage.setItem('g_k',raw);
      if(typed&&pin.length>=4)await encKey(raw,pin);
      $('pk').value='';$('pin').value='';
    }
    $('pkErr').textContent='';
    $('btnCfg').textContent=S.pub.slice(0,4)+'...'+S.pub.slice(-4);
    $('addr').textContent=S.pub;$('dot').className='fa-solid fa-circle text-[6px] text-green-400 animate-pulse';
    $('cfgCard').classList.add('hidden');
    log('Wallet aktif: '+S.pub,'ok');await refreshBalance();renderPort();
  }catch(e){$('pkErr').textContent=e.message}
}
function clearKey(){
  stopBot();S.kp=null;S.pub='';S.sol=0;$('pk').value='';$('pin').value='';
  sessionStorage.removeItem('g_k');localStorage.removeItem('g_enc');
  $('btnCfg').textContent='Set Key';$('addr').textContent='Private key belum diisi';
  $('dot').className='fa-solid fa-circle text-[6px] text-zinc-600';updBal();
  log('Key dihapus dari perangkat'+(Object.keys(S.pos).length?' — posisi terbuka tidak dipantau sampai wallet diaktifkan lagi':''),'warn');
}
async function refreshBalance(){if(!S.pub)return false;try{const r=await rpc('getBalance',[S.pub,{commitment:'confirmed'}]);S.sol=r.value/1e9;updBal();return true}catch(e){log('Gagal baca saldo: '+e.message,'err');return false}}
function updBal(){$('bal').textContent=S.sol.toFixed(4)+' SOL';$('balIdr').textContent='Rp '+Math.round(S.sol*S.solUsd*IDR).toLocaleString('id-ID')}
async function loadSolPrice(){try{const r=await jget(`${DS}/tokens/v1/solana/${SOLM}`);const p=r.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];S.solUsd=parseFloat(p.priceUsd);$('solPrice').textContent='SOL: $'+S.solUsd.toFixed(2);updBal()}catch(e){}}

/* ---------- data DexScreener ---------- */
async function pairsFor(addrs){
  const best={};
  for(let i=0;i<addrs.length;i+=30){
    const r=await jget(`${DS}/tokens/v1/solana/${addrs.slice(i,i+30).join(',')}`).catch(()=>[]);
    (r||[]).forEach(p=>{const a=p.baseToken?.address;if(!a||a===SOLM)return;if(!best[a]||(p.liquidity?.usd||0)>(best[a].liquidity?.usd||0))best[a]=p});
  }
  return best;
}
async function candidates(cat){
  const U={new:['token-profiles/latest/v1'],hot:['token-boosts/top/v1','token-boosts/latest/v1'],all:['token-profiles/latest/v1','token-boosts/latest/v1','token-boosts/top/v1']}[cat];
  const set=new Set();
  for(const u of U){const r=await jget(`${DS}/${u}`).catch(()=>[]);(r||[]).filter(x=>x.chainId==='solana').forEach(x=>set.add(x.tokenAddress))}
  return pairsFor([...set].slice(0,90));
}
async function loadFeed(){
  $('feedMsg').textContent='Memuat data DexScreener…';
  try{
    S.tokens=Object.values(await candidates(S.cat));
    S.tokens.sort(S.cat==='hot'?(a,b)=>(b.volume?.h24||0)-(a.volume?.h24||0):(a,b)=>(b.pairCreatedAt||0)-(a.pairCreatedAt||0));
    $('feedMsg').textContent=S.tokens.length+' token · data langsung dari DexScreener · '+new Date().toLocaleTimeString('id-ID');
    renderFeed();
  }catch(e){$('feedMsg').textContent='Gagal memuat: '+e.message}
}
async function search(){
  const v=$('q').value.trim();if(!v)return loadFeed();
  $('feedMsg').textContent='Mencari…';
  try{
    let list;
    if(v.length>=32){list=Object.values(await pairsFor([v]))}
    else{const r=await jget(`${DS}/latest/dex/search?q=${encodeURIComponent(v)}`);list=(r.pairs||[]).filter(p=>p.chainId==='solana')}
    S.tokens=list;$('feedMsg').textContent=list.length+' hasil';renderFeed();
  }catch(e){$('feedMsg').textContent='Gagal: '+e.message}
}
function setCat(c){S.cat=c;document.querySelectorAll('.cat').forEach(b=>b.className='cat px-3.5 py-2 rounded-xl text-xs font-bold '+(b.dataset.cat===c?'bg-green-500 text-black':'bg-zinc-900 text-zinc-400'));$('q').value='';loadFeed()}
const chg=v=>v==null?'<span class="text-zinc-500">-</span>':`<span class="${v>=0?'text-green-400':'text-red-400'}">${v>=0?'+':''}${v}%</span>`;
function renderFeed(){
  S.by={};
  $('feed').innerHTML=S.tokens.slice(0,40).map(p=>{
    const a=p.baseToken.address;S.by[a]=p;
    const bond=p.dexId==='pumpfun';
    return `<div class="gc rounded-2xl p-4 space-y-2 border-l-4 ${(p.priceChange?.h24||0)>=0?'border-l-green-500':'border-l-red-500'}">
      <div class="flex justify-between items-start">
        <div><div class="text-xs font-bold">$${esc(p.baseToken.symbol)} <span class="text-[9px] px-1.5 py-0.5 rounded ${bond?'bg-amber-500/20 text-amber-400':'bg-purple-500/20 text-purple-400'}">${bond?'Bonding curve':esc(p.dexId)}</span></div>
        <div class="text-[10px] text-zinc-400 truncate max-w-[180px]">${esc(p.baseToken.name)} · umur ${fmtAge(p.pairCreatedAt)}</div></div>
        <div class="text-right"><div class="text-xs font-black">$${fmtP(p.priceUsd||0)}</div></div>
      </div>
      <div class="grid grid-cols-3 gap-1 text-[10px] text-zinc-400">
        <div>5m ${chg(p.priceChange?.m5)}</div><div>1j ${chg(p.priceChange?.h1)}</div><div>24j ${chg(p.priceChange?.h24)}</div>
        <div>Liq $${fmtN(p.liquidity?.usd)}</div><div>Vol24 $${fmtN(p.volume?.h24)}</div><div>MC $${fmtN(p.marketCap||p.fdv)}</div>
      </div>
      <div class="flex items-center justify-between pt-1">
        <a href="${esc(p.url)}" target="_blank" rel="noopener" class="text-[10px] text-green-400 font-bold">DexScreener</a>
        <span class="text-[9px] font-mono text-zinc-500">${a.slice(0,6)}…${a.slice(-4)}</span>
        <button data-b="${a}" class="bg-green-500 text-black px-3 py-1.5 rounded-lg text-[11px] font-extrabold">Beli ${S.cfg.buy} SOL</button>
      </div></div>`}).join('')||'<div class="gc rounded-2xl p-6 text-center text-xs text-zinc-400">Tidak ada data.</div>';
}

/* ---------- eksekusi trade ---------- */
async function jupTx(inM,outM,amount){
  const bps=Math.round(S.cfg.slip*100),bases=[['https://lite-api.jup.ag',false]];
  if(S.cfg.jup)bases.unshift(['https://api.jup.ag',true]);
  let err;
  for(const [b,k] of bases){
    try{
      const h=k?{'x-api-key':S.cfg.jup}:{};
      const q=await jget(`${b}/swap/v1/quote?inputMint=${inM}&outputMint=${outM}&amount=${amount}&slippageBps=${bps}`,{headers:h});
      if(q.error)throw new Error(q.error);
      const s=await jget(`${b}/swap/v1/swap`,{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify({quoteResponse:q,userPublicKey:S.pub,wrapAndUnwrapSol:true,dynamicComputeUnitLimit:true,prioritizationFeeLamports:{priorityLevelWithMaxLamports:{maxLamports:Math.round(S.cfg.fee*1e9),priorityLevel:'high'}}})});
      if(!s.swapTransaction)throw new Error(s.error||'Jupiter tidak mengembalikan transaksi');
      return b64dec(s.swapTransaction);
    }catch(e){err=e}
  }
  throw err;
}
async function pumpTx(action,mint,amount,sol){
  const r=await fetch('https://pumpportal.fun/api/trade-local',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({publicKey:S.pub,action,mint,amount,denominatedInSol:sol,slippage:S.cfg.slip,priorityFee:S.cfg.fee,pool:'auto'})});
  if(!r.ok)throw new Error('PumpPortal '+r.status+': '+(await r.text()).slice(0,100));
  return new Uint8Array(await r.arrayBuffer());
}
async function sendSigned(bytes){
  const tx=solanaWeb3.VersionedTransaction.deserialize(bytes);tx.sign([S.kp]);
  const sig=await rpc('sendTransaction',[b64enc(tx.serialize()),{encoding:'base64',skipPreflight:false,maxRetries:3,preflightCommitment:'confirmed'}]);
  for(let i=0;i<40;i++){
    await sleep(1500);
    const st=await rpc('getSignatureStatuses',[[sig],{searchTransactionHistory:true}]);const v=st.value[0];
    if(v){if(v.err)throw new Error('Transaksi gagal on-chain: '+JSON.stringify(v.err));if(['confirmed','finalized'].includes(v.confirmationStatus))return sig}
  }
  const e=new Error('Konfirmasi timeout, cek manual di Solscan: '+sig);e.noRetry=true;throw e;
}
async function execute(side,mint,dex,amt){
  const pump=mint.endsWith('pump');
  const order=dex==='pumpfun'?['pump','jup']:pump?['jup','pump']:['jup'];
  let last;
  for(const src of order){
    try{
      let bytes;
      if(src==='jup')bytes=side==='buy'?await jupTx(SOLM,mint,Math.floor(amt*1e9)):await jupTx(mint,SOLM,amt.toString());
      else bytes=side==='buy'?await pumpTx('buy',mint,amt,'true'):await pumpTx('sell',mint,'100%','false');
      return await sendSigned(bytes);
    }catch(e){last=e;if(e.noRetry)throw e;log(`Rute ${src} gagal: ${e.message}`,'warn')}
  }
  throw last;
}
async function tokenBal(mint){
  const r=await rpc('getTokenAccountsByOwner',[S.pub,{mint},{encoding:'jsonParsed'}]);
  let raw=0n,dec=0;r.value.forEach(a=>{const t=a.account.data.parsed.info.tokenAmount;raw+=BigInt(t.amount);dec=t.decimals});
  return {raw,dec};
}
async function mintSafe(m){try{const r=await rpc('getAccountInfo',[m,{encoding:'jsonParsed'}]);const i=r?.value?.data?.parsed?.info;return !!i&&!i.mintAuthority&&!i.freezeAuthority}catch{return false}}

const pct=v=>v==null?'-':(v>=0?'+':'')+v+'%';
const snap=p=>({liq:p.liquidity?.usd,v1:p.volume?.h1,m5:p.priceChange?.m5,h1:p.priceChange?.h1});
const mk=m=>m?[['Likuiditas','$'+fmtN(m.liq)],['Vol 1j','$'+fmtN(m.v1)],['Ubah 5m / 1j',pct(m.m5)+' / '+pct(m.h1)]]:[];
function downs(a,n=60){if(a.length<=n)return a;const o=[];for(let i=0;i<n;i++)o.push(a[Math.round(i*(a.length-1)/(n-1))]);return o}
function addHist(o){S.hist.unshift(o);S.hist=S.hist.slice(0,50);localStorage.setItem('g_hist',JSON.stringify(S.hist))}
function spark(a,entry){
  if(!a||a.length<2)return '<div class="text-[10px] text-zinc-500 mt-2">Grafik tidak tersedia</div>';
  const all=entry?[...a,entry]:a,mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1,w=240,h=48;
  const y=v=>(h-2-((v-mn)/rg)*(h-4)).toFixed(1);
  const pts=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+y(v)).join(' ');
  const c=a[a.length-1]>=a[0]?'#22c55e':'#ef4444';
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-12 mt-2"><polygon points="0,${h} ${pts} ${w},${h}" fill="${c}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6"/>${entry?`<line x1="0" x2="${w}" y1="${y(entry)}" y2="${y(entry)}" stroke="#a1a1aa" stroke-dasharray="3 3" stroke-width=".8"/>`:''}</svg>`;
}
async function chartFor(pairAddr,p){
  try{
    if(pairAddr){
      const r=await jget(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${pairAddr}/ohlcv/minute?aggregate=5&limit=48`);
      const l=r?.data?.attributes?.ohlcv_list;
      if(l&&l.length>=3)return {s:l.slice().reverse().map(x=>Number(x[4])),note:'Grafik 5 menit, 4 jam terakhir (GeckoTerminal). Garis putus-putus = harga masuk'};
    }
  }catch(e){}
  if(p&&p.priceUsd){
    const n=parseFloat(p.priceUsd),c=p.priceChange||{},s=[];
    ['h24','h6','h1','m5'].forEach(k=>{if(c[k]!=null&&c[k]>-100)s.push(n/(1+c[k]/100))});
    s.push(n);
    if(s.length>=3)return {s,note:'Pergerakan dari perubahan 24j/6j/1j/5m (DexScreener)'};
  }
  return {s:[],note:''};
}
function bubble(o){
  const box=$('bubbles'),col={g:'border-green-500/50',r:'border-red-500/50',a:'border-amber-500/50'}[o.tone||'g'];
  const d=document.createElement('div');
  d.className='bub gc rounded-2xl p-3 text-xs pointer-events-auto border '+col;
  d.innerHTML=`<div class="flex justify-between items-center"><b class="text-[12px]">${esc(o.title)}</b><span class="text-zinc-500 text-[10px]">${new Date().toLocaleTimeString('id-ID',{hour12:false})} · ketuk untuk tutup</span></div>
  <div class="grid grid-cols-2 gap-x-3 gap-y-0.5 mt-2 text-[11px]">${o.rows.map(([l,v,c])=>`<div class="text-zinc-400">${esc(l)}</div><div class="text-right font-bold ${c||''}">${esc(v)}</div>`).join('')}</div>${spark(o.series,o.entry)}<div class="text-[9px] text-zinc-500 mt-1">${esc(o.note||'')}</div>`;
  d.onclick=()=>d.remove();box.appendChild(d);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>d.remove(),25000);
}

function buy(pair,auto){return run(async()=>{
  const mint=pair.baseToken.address,sym=pair.baseToken.symbol,amt=S.cfg.buy;
  if(!S.kp)throw new Error('Isi private key dulu');
  await refreshBalance();const b0=S.sol;
  if(b0<amt+0.005)throw new Error(`Saldo ${b0.toFixed(4)} SOL kurang (butuh ≥ ${(amt+0.005).toFixed(4)} untuk beli + rent + fee)`);
  log(`${auto?'[AUTO] ':''}Beli ${sym} ${amt} SOL…`);
  const sig=await execute('buy',mint,pair.dexId,amt);
  let bal={raw:0n,dec:0};
  for(let i=0;i<6&&bal.raw===0n;i++){bal=await tokenBal(mint).catch(()=>bal);if(bal.raw===0n)await sleep(1500)}
  const ui=Number(bal.raw)/10**bal.dec,pr=parseFloat(pair.priceUsd);
  await refreshBalance();const d=b0-S.sol,cost=(d>0&&d<amt+0.01)?d:amt;
  const entry=(ui>0&&S.solUsd)?amt*S.solUsd/ui:pr;
  S.pos[mint]={sym,sol:amt,cost,entry,px:pr,dex:pair.dexId,pair:pair.pairAddress,t:Date.now(),hist:[pr],m:snap(pair)};savePos();
  log(`Beli ${sym} sukses · tx ${sig.slice(0,10)}…`,'ok');
  renderPort();
  chartFor(pair.pairAddress,pair).then(ch=>bubble({tone:'g',title:`${auto?'AUTO-BUY':'BUY'} $${sym}`,
    rows:[['Modal',amt+' SOL'],['Biaya awal aktual',cost.toFixed(4)+' SOL (termasuk fee/rent)'],['Harga masuk','$'+fmtP(entry)],['Jumlah token',fmtN(ui)],['TP / SL','+'+S.cfg.tp+'% / -'+S.cfg.sl+'%'],...mk(snap(pair)),['Tx',sig.slice(0,8)+'…']],
    series:ch.s,entry,note:ch.note}));
})}
function sellToken(mint,why){return run(async()=>{
  const p=S.pos[mint];if(!p)return;
  try{
    log(`Jual ${p.sym} (${why})…`);
    const {raw}=await tokenBal(mint);
    if(raw===0n){delete S.pos[mint];savePos();renderPort();log(`${p.sym}: saldo token 0, posisi dihapus`,'warn');return}
    const ok0=await refreshBalance(),b0=S.sol;
    const sig=await execute('sell',mint,p.dex,raw);
    await sleep(1000);const ok1=await refreshBalance();
    const est=!(ok0&&ok1),cost=p.cost||p.sol,got=est?p.sol*(p.px/p.entry):S.sol-b0;
    const pnlSol=got-cost,pnlPct=cost?pnlSol/cost*100:0,move=Math.round((p.px/p.entry-1)*1000)/10;
    delete S.pos[mint];savePos();
    addHist({t:Date.now(),sym:p.sym,why,pnlSol,pnlPct});
    log(`Jual ${p.sym} sukses · hasil bersih ${pnlSol>=0?'+':''}${pnlSol.toFixed(4)} SOL (${pnlPct>=0?'+':''}${pnlPct.toFixed(1)}%) · tx ${sig.slice(0,10)}…`,'ok');
    renderPort();
    const h=p.hist||[];
    (h.length>=6?Promise.resolve({s:downs(h),note:'Pergerakan harga sejak beli (data bot). Garis putus-putus = harga masuk'}):chartFor(p.pair,null))
      .then(ch=>{if(!(ch.s&&ch.s.length>=2))ch={s:[p.entry,p.px],note:'Harga masuk → keluar'};
        bubble({tone:pnlSol>=0?'g':'r',title:`${why.startsWith('TP')?'TAKE PROFIT':why.startsWith('SL')?'STOP LOSS':'JUAL'} $${p.sym}`,
          rows:[['Alasan',why],['Masuk → keluar','$'+fmtP(p.entry)+' → $'+fmtP(p.px)],['Gerak harga',pct(move)],['Diterima',got.toFixed(4)+' SOL'+(est?' (perkiraan)':'')],['Hasil bersih',(pnlSol>=0?'+':'')+pnlSol.toFixed(4)+' SOL ('+(pnlPct>=0?'+':'')+pnlPct.toFixed(1)+'%)',pnlSol>=0?'text-green-400':'text-red-400'],...mk(p.m),['Tx',sig.slice(0,8)+'…']],
          series:ch.s,entry:p.entry,note:ch.note})});
  }catch(e){log(`Jual ${p.sym} gagal: ${e.message}`,'err')}
})}

/* ---------- bot ---------- */
async function scan(){
  if(!S.run||S.scanning)return;S.scanning=true;
  try{
    const c=S.cfg;
    if(Object.keys(S.pos).length>=c.max)return;
    if(S.sol<c.buy+0.005){log('Saldo tidak cukup, auto-buy dihentikan','warn');stopBot();return}
    const b=await candidates('all'),now=Date.now();
    const list=Object.values(b).filter(p=>{
      const a=p.baseToken.address;if(S.pos[a]||tried.has(a))return false;
      const age=(now-(p.pairCreatedAt||0))/36e5,t=p.txns?.h1||{};
      return (p.liquidity?.usd||0)>=c.liq&&(p.volume?.h1||0)>=c.vol&&age>=0.25&&age<=c.age&&(p.priceChange?.m5||0)>=0&&(p.priceChange?.h1||0)>0&&(p.priceChange?.h1||0)<300&&(t.buys||0)>=20&&(t.buys||0)>=(t.sells||0)*1.1;
    });
    log(`Scan: ${Object.keys(b).length} token, ${list.length} lolos filter`);
    list.sort((a,b)=>(b.volume?.h1||0)-(a.volume?.h1||0));
    for(const p of list){
      const a=p.baseToken.address;tried.add(a);
      if(!(await mintSafe(a))){log(`Lewati ${p.baseToken.symbol}: mint/freeze authority masih aktif`,'warn');continue}
      try{await buy(p,true)}catch(e){log('Beli gagal: '+e.message,'err')}
      break;
    }
  }catch(e){log('Scan error: '+e.message,'err')}finally{S.scanning=false}
}
async function monitor(){
  const m=Object.keys(S.pos);if(!m.length||S.mon)return;S.mon=true;
  try{
    const b=await pairsFor(m);
    m.forEach(a=>{const p=b[a],pos=S.pos[a];if(!p||!pos)return;const px=parseFloat(p.priceUsd);
      if(px){pos.px=px;(pos.hist=pos.hist||[]).push(px);if(pos.hist.length>240)pos.hist=downs(pos.hist,120)}
      pos.dex=p.dexId;pos.pair=p.pairAddress;pos.m=snap(p)});
    savePos();renderPort();
    if(S.kp)for(const a of m){
      const p=S.pos[a];if(!p||!p.px||!p.entry)continue;
      const pnl=(p.px/p.entry-1)*100;
      if(pnl>=S.cfg.tp)sellToken(a,`TP +${pnl.toFixed(1)}%`);else if(pnl<=-S.cfg.sl)sellToken(a,`SL ${pnl.toFixed(1)}%`);
    }
  }catch(e){}finally{S.mon=false}
}
function startBot(){
  if(!S.kp)return toast('Private key diperlukan','Isi dan aktifkan wallet dulu');
  readCfg();
  if(!confirm(`Auto-buy akan membeli token memakai UANG ASLI:\n• ${S.cfg.buy} SOL per trade, maks ${S.cfg.max} posisi\n• TP +${S.cfg.tp}% / SL -${S.cfg.sl}%\n\nLanjutkan?`))return;
  S.run=true;$('badge').className='bg-green-500/20 text-green-400 px-3 py-1.5 rounded-xl text-xs font-extrabold animate-pulse';$('badge').textContent='AUTO-BUY AKTIF';
  log('Auto-buy dimulai','ok');scan();
}
function stopBot(){if(S.run)log('Auto-buy dihentikan','warn');S.run=false;$('badge').className='bg-zinc-800 text-zinc-400 px-3 py-1.5 rounded-xl text-xs font-extrabold';$('badge').textContent='STANDBY'}

/* ---------- portofolio ---------- */
function renderPort(){
  const a=Object.keys(S.pos);let val=0,pnlSol=0;
  $('posList').innerHTML=a.map(m=>{
    const p=S.pos[m],r=p.entry?p.px/p.entry:1,pnl=(r-1)*100;val+=p.sol*r;pnlSol+=p.sol*(r-1);
    return `<div class="gc rounded-2xl p-4 flex items-center justify-between border-l-4 ${pnl>=0?'border-l-green-500':'border-l-red-500'}">
      <div><div class="text-xs font-bold">$${esc(p.sym)}</div><div class="text-[10px] text-zinc-400">Modal ${p.sol} SOL · masuk $${fmtP(p.entry)}</div>
      <div class="text-[11px] font-bold ${pnl>=0?'text-green-400':'text-red-400'}">${pnl>=0?'+':''}${pnl.toFixed(1)}% · $${fmtP(p.px)}</div></div>
      <button data-s="${m}" class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-xl text-xs font-bold">Jual</button></div>`}).join('')
    ||'<div class="gc rounded-2xl p-6 text-center text-xs text-zinc-400">Belum ada posisi aktif.</div>';
  $('pTot').textContent=(S.sol+val).toFixed(4)+' SOL';
  $('pPnl').textContent='PnL posisi terbuka: '+(pnlSol>=0?'+':'')+pnlSol.toFixed(4)+' SOL';
  $('pPnl').className='text-xs font-extrabold mt-1 '+(pnlSol>=0?'text-green-400':'text-red-400');
  const net=S.hist.reduce((s,h)=>s+h.pnlSol,0);
  $('histList').innerHTML=S.hist.length
    ?`<div class="text-[10px] text-zinc-400 mb-1">Hasil bersih ${S.hist.length} trade terakhir: <b class="${net>=0?'text-green-400':'text-red-400'}">${net>=0?'+':''}${net.toFixed(4)} SOL</b></div>`
      +S.hist.slice(0,20).map(h=>`<div class="flex justify-between text-[11px] py-1 border-t border-white/5"><span>$${esc(h.sym)} <span class="text-zinc-500">${esc(h.why)} · ${new Date(h.t).toLocaleTimeString('id-ID',{hour12:false})}</span></span><span class="${h.pnlSol>=0?'text-green-400':'text-red-400'}">${h.pnlPct>=0?'+':''}${h.pnlPct.toFixed(1)}% · ${h.pnlSol>=0?'+':''}${h.pnlSol.toFixed(4)}</span></div>`).join('')
    :'<div class="text-[11px] text-zinc-500">Belum ada trade selesai.</div>';
}
function tab(t){
  $('tabMarket').classList.toggle('hidden',t!=='m');$('tabPort').classList.toggle('hidden',t!=='p');
  $('nM').className='flex flex-col items-center gap-1 '+(t==='m'?'text-green-400 font-bold':'text-zinc-400');
  $('nP').className='flex flex-col items-center gap-1 '+(t==='p'?'text-green-400 font-bold':'text-zinc-400');
  if(t==='p')renderPort();
}

cfgToUI();

$('btnSave').onclick=saveKey;$('btnClear').onclick=clearKey;

document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));
$('feed').addEventListener('click',e=>{
  const b=e.target.closest('[data-b]');if(!b)return;

});
$('posList').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b)return;
  if(!S.kp)return toast('Private key diperlukan','Aktifkan wallet untuk menjual');

});
setInterval(scan,20000);setInterval(monitor,6000);
setInterval(()=>{loadSolPrice();refreshBalance()},30000);
setCat('new');loadSolPrice();tab('m');renderPort();
if(sessionStorage.getItem('g_k')){$('pk').value=sessionStorage.getItem('g_k');saveKey()}
else if(localStorage.getItem('g_enc'))$('pkErr').textContent='Key tersimpan terenkripsi. Masukkan PIN lalu tekan Simpan & aktifkan wallet.';
